name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marginnote
          POSTGRES_PASSWORD: marginnote
          POSTGRES_DB: marginnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marginnote"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://marginnote:marginnote@localhost:5432/marginnote_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check (tsc build)
        run: npm run build -w api
      - name: Tests (real postgres)
        run: npm run coverage -w api

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check + build
        run: npm run build -w extension
      - name: Tests
        run: npm run coverage -w extension

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint -w dashboard
      - run: npm run typecheck -w dashboard
      - name: Tests
        run: npm run coverage -w dashboard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api + dashboard images
        run: docker compose build api dashboard
